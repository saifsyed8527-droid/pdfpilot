name: Secret boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-27
        with:
          persist-credentials: false
      - run: node --test tests/secret-boundaries.test.cjs
      - run: node scripts/check-secret-boundaries.cjs
