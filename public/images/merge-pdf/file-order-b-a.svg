<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="400" viewBox="0 0 1300 400"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7Z" fill="#15334a"/></marker></defs><rect width="1300" height="400" rx="18" fill="#edf7f7"/><text x="35" y="53" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#15334a" font-weight="bold">Merge: several documents, one PDF</text><text x="35" y="89" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#526678" font-weight="normal">Keep the intended document order. Each source page stays a separate output page.</text><text x="45" y="140" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#15334a" font-weight="bold">File B</text><rect x="45" y="160" width="72" height="90" rx="7" fill="white" stroke="#167f83" stroke-width="2"/><text x="61" y="213" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#167f83" font-weight="bold">B1</text><path d="M59 228h44 M59 236h34" stroke="#c2d1dc" stroke-width="2"/><rect x="130" y="160" width="72" height="90" rx="7" fill="white" stroke="#167f83" stroke-width="2"/><text x="146" y="213" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#167f83" font-weight="bold">B2</text><path d="M144 228h44 M144 236h34" stroke="#c2d1dc" stroke-width="2"/><text x="238" y="215" font-family="DejaVu Sans,sans-serif" font-size="38" fill="#15334a" font-weight="normal">+</text><text x="300" y="140" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#15334a" font-weight="bold">File A</text><rect x="300" y="160" width="72" height="90" rx="7" fill="white" stroke="#167f83" stroke-width="2"/><text x="316" y="213" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#167f83" font-weight="bold">A1</text><path d="M314 228h44 M314 236h34" stroke="#c2d1dc" stroke-width="2"/><rect x="385" y="160" width="72" height="90" rx="7" fill="white" stroke="#167f83" stroke-width="2"/><text x="401" y="213" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#167f83" font-weight="bold">A2</text><path d="M399 228h44 M399 236h34" stroke="#c2d1dc" stroke-width="2"/><path d="M490 205h96" fill="none" stroke="#15334a" stroke-width="3"/><polygon points="595,205 583,198 583,212" fill="#15334a"/><text x="640" y="140" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#15334a" font-weight="bold">One PDF • file order B → A</text><rect x="640" y="160" width="72" height="90" rx="7" fill="white" stroke="#167f83" stroke-width="2"/><text x="656" y="213" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#167f83" font-weight="bold">B1</text><path d="M654 228h44 M654 236h34" stroke="#c2d1dc" stroke-width="2"/><rect x="725" y="160" width="72" height="90" rx="7" fill="white" stroke="#167f83" stroke-width="2"/><text x="741" y="213" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#167f83" font-weight="bold">B2</text><path d="M739 228h44 M739 236h34" stroke="#c2d1dc" stroke-width="2"/><rect x="810" y="160" width="72" height="90" rx="7" fill="white" stroke="#167f83" stroke-width="2"/><text x="826" y="213" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#167f83" font-weight="bold">A1</text><path d="M824 228h44 M824 236h34" stroke="#c2d1dc" stroke-width="2"/><rect x="895" y="160" width="72" height="90" rx="7" fill="white" stroke="#167f83" stroke-width="2"/><text x="911" y="213" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#167f83" font-weight="bold">A2</text><path d="M909 228h44 M909 236h34" stroke="#c2d1dc" stroke-width="2"/><text x="45" y="305" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#526678" font-weight="normal">Combining files does not place multiple pages onto one printed sheet.</text><text x="35" y="377" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#526678" font-weight="normal">Concept illustration • Example documents, not a screenshot of the tool</text></svg>